function bus(t, vol) { const g = ctx.createGain(); g.gain.value = vol; g.connect(master); g.connect(send); return g; }
/* synth building blocks; every frequency is scaled by r (pitch) */
function env(param, t, a, d, peak) {
  param.setValueAtTime(0.0001, t);
  param.linearRampToValueAtTime(peak, t + a);
  param.exponentialRampToValueAtTime(0.0001, t + a + d);
}
function tone(o, t, { type = 'sine', f, f2, glide, a = 0.003, d = 0.2, g = 0.5, r = 1, vib = 0, vibRate = 6, lp }) {
  const os = ctx.createOscillator(); os.type = type;
  os.frequency.setValueAtTime(f * r, t);
  if (f2) os.frequency.exponentialRampToValueAtTime(f2 * r, t + (glide || a + d));
  if (vib) { const l = ctx.createOscillator(), lg = ctx.createGain(); l.frequency.value = vibRate; lg.gain.value = vib * f * r; l.connect(lg); lg.connect(os.frequency); l.start(t); l.stop(t + a + d + 0.05); }
  const ga = ctx.createGain(); env(ga.gain, t, a, d, g);
  let node = os;
  if (lp) { const fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = lp * r; os.connect(fl); node = fl; }
  node.connect(ga); ga.connect(o);
  os.start(t); os.stop(t + a + d + 0.05);
}
function noise(o, t, { type = 'bandpass', f = 1000, f2, Q = 1, a = 0.002, d = 0.1, g = 0.5, r = 1, flutter = 0 }) {
  const s = ctx.createBufferSource(); s.buffer = noiseBuf;
  const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = Q;
  fl.frequency.setValueAtTime(f * r, t);
  if (f2) fl.frequency.exponentialRampToValueAtTime(f2 * r, t + a + d);
  const ga = ctx.createGain(); env(ga.gain, t, a, d, g);
  s.connect(fl); fl.connect(ga);
  if (flutter) { const am = ctx.createGain(); am.gain.value = 0.5; const l = ctx.createOscillator(); const lg = ctx.createGain(); l.frequency.value = flutter; lg.gain.value = 0.5; l.connect(lg); lg.connect(am.gain); l.start(t); l.stop(t + a + d + 0.05); ga.connect(am); am.connect(o); }
  else ga.connect(o);
  s.start(t, Math.random() * 0.5); s.stop(t + a + d + 0.05);
}
function metal(o, t, base, ratios, { d = 0.4, g = 0.3, r = 1, a = 0.001 } = {}) {
  ratios.forEach((k, i) => tone(o, t, { f: base * k, a, d: d / (1 + i * 0.35), g: g / (1 + i * 0.6), r }));
}

  page: { name: 'Overcooked-style: ticket fwip', desc: 'An order ticket whipping off the rail.', play: (o, t, r) => noise(o, t, { f: 1800, f2: 5200, Q: 1.3, d: 0.09, g: 0.6, r }) },
  grab: { name: 'Overcooked-style: pickup pop', desc: 'The classic grab: a round, plasticky pop that rises.', play: (o, t, r) => { tone(o, t, { f: 280, f2: 880, glide: 0.05, d: 0.07, g: 0.6, r }); noise(o, t, { type: 'lowpass', f: 1200, d: 0.02, g: 0.2, r }); } },

Object.entries(OC).forEach(([s, alt]) => SOUNDS[s].alts.unshift({ id: 'oc-' + s, ...alt }));


// Long enough for each sound's tail and echo.
const LENGTH = { gong: 3.2, cheer: 1.2, ding: 1.2, error: 1.2, cloche: 1.2 };
async function render(s, id) {
  const seconds = LENGTH[s] || 0.8;
  ctx = new OfflineAudioContext(1, Math.ceil(SR * seconds), SR);
  master = ctx.createGain(); master.gain.value = 0.9;
  const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -6; comp.ratio.value = 4;
  master.connect(comp); comp.connect(ctx.destination);
  send = ctx.createGain(); send.gain.value = 0.16;
  const d1 = ctx.createDelay(0.5); d1.delayTime.value = 0.075;
  const fb = ctx.createGain(); fb.gain.value = 0.28;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2600;
  send.connect(d1); d1.connect(lp); lp.connect(fb); fb.connect(d1); lp.connect(master);
  noiseBuf = ctx.createBuffer(1, SR, SR);
  const ch = noiseBuf.getChannelData(0); for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
  const alt = SOUNDS[s].alts.find(a => a.id === id);
  alt.play(bus(0.005, VOLUME[s]), 0.005, 1);
  const out = await ctx.startRendering();
  // Undo the board's per-sound volume: the app applies its own (the same numbers).
  const data = out.getChannelData(0), scaled = new Float32Array(data.length);
  for (let i = 0; i < data.length; i++) scaled[i] = data[i] / VOLUME[s];
  return scaled;
}
(async () => {
  const result = {};
  for (const [s, id] of Object.entries(PICKS)) {
    result[s] = [];
    for (let v = 0; v < VARIANTS[s]; v++) {
      const samples = await render(s, id);
      result[s].push(Array.from(samples, x => Math.round(x * 10000) / 10000));
    }
  }
  document.getElementById('out').textContent = JSON.stringify(result);
})();
