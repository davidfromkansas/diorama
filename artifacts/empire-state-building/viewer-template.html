<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Empire State Building · Low poly</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e9e7df;color:#303933;font-family:system-ui}canvas{display:block;width:100vw;height:100vh;touch-action:none}header{position:absolute;left:32px;top:28px;pointer-events:none}h1{font-size:24px;font-weight:500;margin:0 0 8px}p{font-size:13px;color:#70776c;margin:0}footer{position:absolute;bottom:24px;left:32px;right:32px;display:flex;gap:18px;align-items:center;font-size:12px}a,button{color:inherit;background:none;border:1px solid #a8ada0;border-radius:20px;padding:10px 15px;text-decoration:none;cursor:pointer}span{margin-right:auto}</style>
<canvas aria-label="Interactive low-poly Empire State Building"></canvas><header><h1>Empire State Building</h1><p>NEW YORK · LOW POLY · TRIANGLE_COUNT TRIANGLES</p></header><footer><span>Drag to orbit · Scroll to zoom</span><button id="reset">Reset view</button><a href="empire-state-building.glb" download>Download GLB ↓</a></footer>
<script>
const canvas=document.querySelector('canvas'), gl=canvas.getContext('webgl',{antialias:true});
if(!gl){document.querySelector('p').textContent='WebGL unavailable. Open preview.png or download the GLB.';throw Error('WebGL unavailable')}
const vertex=`attribute vec3 position,normal,color; uniform vec2 viewport; uniform float yaw,pitch,zoom; varying vec3 shade; void main(){vec3 p=position-vec3(0.,22.,0.); float x=cos(yaw)*p.x+sin(yaw)*p.z;float z=-sin(yaw)*p.x+cos(yaw)*p.z;float y=cos(pitch)*p.y-sin(pitch)*z;float depth=sin(pitch)*p.y+cos(pitch)*z;gl_Position=vec4(x*zoom*viewport.y/viewport.x,y*zoom,-depth/100.,1.);shade=color*(.70+.30*max(0.,dot(normal,normalize(vec3(.35,.8,.48)))));}`;
const fragment=`precision mediump float; varying vec3 shade; void main(){gl_FragColor=vec4(shade,1.);}`;
function shader(type,source){let s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
const program=gl.createProgram();gl.attachShader(program,shader(gl.VERTEX_SHADER,vertex));gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragment));gl.linkProgram(program);if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(program));gl.useProgram(program);
const data=new Float32Array(MODEL_DATA);gl.bindBuffer(gl.ARRAY_BUFFER,gl.createBuffer());gl.bufferData(gl.ARRAY_BUFFER,data,gl.STATIC_DRAW);
['position','normal','color'].forEach((name,i)=>{let a=gl.getAttribLocation(program,name);gl.enableVertexAttribArray(a);gl.vertexAttribPointer(a,3,gl.FLOAT,false,36,i*12)});
let yaw=.65,pitch=.22,zoom=.039,drag=null;
function render(){const dpr=Math.min(devicePixelRatio,2);canvas.width=innerWidth*dpr;canvas.height=innerHeight*dpr;gl.viewport(0,0,canvas.width,canvas.height);gl.clearColor(.914,.906,.875,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);gl.uniform2f(gl.getUniformLocation(program,'viewport'),canvas.width,canvas.height);for(const [name,value] of Object.entries({yaw,pitch,zoom}))gl.uniform1f(gl.getUniformLocation(program,name),value);gl.drawArrays(gl.TRIANGLES,0,data.length/9)}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.008;pitch=Math.max(-.3,Math.min(1.2,pitch+(e.clientY-drag[1])*.006));drag=[e.clientX,e.clientY];render()};canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.018,Math.min(.13,zoom*Math.exp(-e.deltaY*.001)));render()},{passive:false});document.querySelector('#reset').onclick=()=>{yaw=.65;pitch=.22;zoom=.039;render()};onresize=render;render();
</script></html>
